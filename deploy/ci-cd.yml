name: DocuLedger CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Back-End Testing & Verification (Pytest Suite)
  test-backend:
    name: Backend Tests & Math Audit Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (Tesseract & Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite (34 Tests)
        run: |
          pytest tests -v --tb=short
        env:
          SECRET_KEY: test-ci-secret-key-998231
          STRIPE_SECRET_KEY: sk_test_mockKeyForCI
          STRIPE_WEBHOOK_SECRET: whsec_testDocuLedgerWebhookSecret001928
          REDIS_URL: redis://localhost:6379/0

  # 2. Front-End Type-Check & Production Build (Next.js 14)
  test-frontend:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_API_URL: https://doculedger-api.onrender.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_mock_stripe

  # 3. Automated Zero-Downtime Deployment (On Main Push)
  deploy:
    name: Trigger Zero-Downtime Deployment
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook (API & Worker)
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Render zero-downtime deployment hook..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Deployment Notification
        run: |
          echo "Continuous Delivery pipeline completed. Vercel & Render builds triggered."
