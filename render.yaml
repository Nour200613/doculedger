# Render Infrastructure as Code (Blueprint) for Zero-Cost Backend Deployment
services:
  # 1. FastAPI REST API Web Service (100% Free Tier)
  - type: web
    name: doculedger-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "DocuLedger B2B Parser API"
      - key: DATABASE_URL
        sync: false # Connect to Supabase (postgresql+asyncpg://postgres:PASSWORD@...)
      - key: SYNC_DATABASE_URL
        sync: false # Connect to Supabase (postgresql://postgres:PASSWORD@...)
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://doculedger.vercel.app
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
